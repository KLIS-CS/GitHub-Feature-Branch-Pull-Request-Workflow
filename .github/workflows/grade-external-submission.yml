name: CP2 — Mother Repository Grader

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write

jobs:
  grade:
    if: ${{ github.repository == 'KLIS-CS/GitHub-Feature-Branch-Pull-Request-Workflow' && !github.event.issue.pull_request && contains(github.event.issue.body, '### Practice Repository URL') }}
    runs-on: ubuntu-latest

    steps:
      - name: Grade CP2 submission
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const student = issue.user.login;
            const marker = '<!-- klis-cp2-mother-score -->';
            const allowedGraders = new Set(['hbycwyh2008']);
            const starter = 'STARTER: Replace this line on your CP2 feature branch with a short description of your change.';

            const escapeRegex = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const section = label => {
              const re = new RegExp(`### ${escapeRegex(label)}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`, 'i');
              const value = issue.body?.match(re)?.[1]?.trim() || '';
              return value === '_No response_' ? '' : value;
            };

            function parseRepoUrl(value) {
              try {
                const u = new URL((value || '').trim());
                if (u.protocol !== 'https:' || u.hostname.toLowerCase() !== 'github.com') return null;
                const parts = u.pathname.split('/').filter(Boolean);
                if (parts.length < 2) return null;
                return { owner: parts[0], repo: parts[1].replace(/\.git$/i, '') };
              } catch { return null; }
            }

            async function publicJson(url) {
              const r = await fetch(url, { headers: { Accept: 'application/vnd.github+json', 'User-Agent': 'KLIS-CS-CP2-Grader' } });
              if (r.status === 404) return null;
              if (r.status === 403 || r.status === 429) throw new Error('GitHub API rate limit reached. Re-run later; this is not a student error.');
              if (!r.ok) throw new Error(`GitHub API returned ${r.status} for ${url}`);
              return await r.json();
            }

            async function publicText(url) {
              const r = await fetch(url, { headers: { 'User-Agent': 'KLIS-CS-CP2-Grader' } });
              if (r.status === 404) return null;
              if (!r.ok) throw new Error(`Unable to read repository file (${r.status}).`);
              return await r.text();
            }

            function parseManualGrade(body) {
              if (!body) return null;
              const legacy = body.match(/(?:^|\n)\s*\/manual-grade\s+(40|[0-3]?\d)(?:\s|$)/i);
              if (legacy) return { score: Number(legacy[1]), breakdown: null, feedback: '' };
              if (!/(?:^|\n)\s*\/manual-grade\s*(?:\n|$)/i.test(body)) return null;

              const readTen = label => {
                const m = body.match(new RegExp(`^\\s*${escapeRegex(label)}:\\s*(10|[0-9])\\s*\\/\\s*10\\s*$`, 'mi'));
                return m ? Number(m[1]) : null;
              };
              const breakdown = {
                branch: readTen('Branch safety'),
                workflow: readTen('Git workflow explanation'),
                pr: readTen('Pull Request understanding'),
                reflection: readTen('Reflection & work quality')
              };
              if (Object.values(breakdown).some(v => v === null)) return null;
              const feedback = body.match(/(?:^|\n)\s*Feedback:\s*\n([\s\S]*)$/i)?.[1]?.trim() || '';
              return { score: Object.values(breakdown).reduce((a,b) => a+b, 0), breakdown, feedback };
            }

            const repositoryUrl = section('Practice Repository URL');
            const statedUsername = section('GitHub Username').replace(/^@/, '').trim();
            const parsed = parseRepoUrl(repositoryUrl);
            const expectedBranch = `cp2-${student}`;

            let meta = null;
            let branchData = null;
            let comparison = null;
            let mainFeature = '';
            let branchFeature = '';
            let submission = '';
            let pulls = [];

            if (parsed) {
              const api = `https://api.github.com/repos/${encodeURIComponent(parsed.owner)}/${encodeURIComponent(parsed.repo)}`;
              meta = await publicJson(api);
              if (meta && meta.private === false) {
                branchData = await publicJson(`${api}/branches/${encodeURIComponent(expectedBranch)}`);
                if (branchData) comparison = await publicJson(`${api}/compare/main...${encodeURIComponent(expectedBranch)}`);
                const mainRaw = `https://raw.githubusercontent.com/${encodeURIComponent(parsed.owner)}/${encodeURIComponent(parsed.repo)}/main`;
                const branchRaw = `https://raw.githubusercontent.com/${encodeURIComponent(parsed.owner)}/${encodeURIComponent(parsed.repo)}/${encodeURIComponent(expectedBranch)}`;
                [mainFeature, branchFeature, submission] = await Promise.all([
                  publicText(`${mainRaw}/feature.txt`),
                  branchData ? publicText(`${branchRaw}/feature.txt`) : null,
                  branchData ? publicText(`${branchRaw}/submission.md`) : null
                ]);
                pulls = await publicJson(`${api}/pulls?state=all&per_page=100`) || [];
              }
            }

            mainFeature = mainFeature ?? '';
            branchFeature = branchFeature ?? '';
            submission = submission ?? '';

            const repoAccessible = Boolean(meta && meta.private === false);
            const ownerMatches = Boolean(meta && meta.owner?.login?.toLowerCase() === student.toLowerCase() && statedUsername.toLowerCase() === student.toLowerCase());
            const source = meta?.template_repository?.full_name?.toLowerCase() || '';
            const sourceAllowed = Boolean(meta && meta.fork === false && (!source || source === 'klis-cs/github-feature-branch-pull-request-workflow'));
            const mainIsDefault = Boolean(meta && (meta.default_branch || '').toLowerCase() === 'main');
            const setupPassed = repoAccessible && ownerMatches && sourceAllowed && mainIsDefault;

            const mainSafe = mainFeature.trim() === starter;
            const featureChanged = Boolean(branchData && branchFeature.trim() !== starter && branchFeature.trim().length >= 20);
            const ahead = comparison?.ahead_by || 0;
            const pr = pulls.find(p => p.head?.ref === expectedBranch && p.base?.ref === 'main' && p.user?.login?.toLowerCase() === student.toLowerCase() && p.state === 'open');

            let changedNames = [];
            let allowedFiles = false;
            if (pr && parsed) {
              const files = await publicJson(`https://api.github.com/repos/${encodeURIComponent(parsed.owner)}/${encodeURIComponent(parsed.repo)}/pulls/${pr.number}/files?per_page=100`) || [];
              changedNames = files.map(f => f.filename);
              const allowed = new Set(['feature.txt', 'submission.md']);
              allowedFiles = changedNames.includes('feature.txt') && changedNames.includes('submission.md') && changedNames.every(name => allowed.has(name));
            }

            const field = label => submission.match(new RegExp(`^${escapeRegex(label)}:\\s*(\\S.*)$`, 'mi'))?.[1]?.trim() || '';
            const answer = heading => submission.match(new RegExp(`## ${escapeRegex(heading)}[\\s\\S]*?\\nAnswer:\\s*([\\s\\S]*?)(?=\\n## |$)`, 'i'))?.[1]?.trim() || '';
            const commandBlock = submission.match(/## Commands Used[\s\S]*?```text\s*([\s\S]*?)```/i)?.[1]?.trim() || '';
            const submissionComplete = ['Name', 'GitHub Username', 'Required Branch', 'Pull Request Number'].every(field) && commandBlock.length >= 10 && ['Question 1','Question 2','Question 3','Reflection'].every(answer);

            const checks = [
              ['Repository setup', setupPassed ? 5 : 0, 5, !repoAccessible ? 'Repository not found or not public.' : !ownerMatches ? `Repository and submitted username must belong to @${student}.` : !sourceAllowed ? 'Use the official KLIS-CS CP2 Copy Exercise.' : !mainIsDefault ? 'Default branch must be main.' : 'Public student-owned CP2 copy detected.'],
              ['Correct checkpoint branch', branchData ? 10 : 0, 10, branchData ? expectedBranch : `expected ${expectedBranch}`],
              ['main remained untouched', mainSafe ? 10 : 0, 10, mainSafe ? 'starter feature.txt unchanged on main' : 'feature.txt on main was modified'],
              ['feature.txt changed on CP2 branch', featureChanged ? 10 : 0, 10, featureChanged ? 'branch feature change detected' : 'replace the starter line on the CP2 branch'],
              ['Branch has commit(s) ahead of main', ahead >= 1 ? 10 : 0, 10, ahead >= 1 ? `${ahead} commit(s) ahead` : 'commit your work on the CP2 branch'],
              ['Open PR to main with only allowed files', pr && allowedFiles ? 10 : pr ? 5 : 0, 10, !pr ? 'open the required Pull Request' : allowedFiles ? `PR #${pr.number}: ${changedNames.join(', ')}` : `PR #${pr.number}; changed: ${changedNames.join(', ') || 'none'}`],
              ['Submission complete', submissionComplete ? 5 : 0, 5, submissionComplete ? 'all required fields and responses completed' : 'complete submission.md']
            ];
            const automatic = checks.reduce((s, [,earned]) => s + earned, 0);

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
            let manual = null;
            for (const c of [...comments].sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at))) {
              if (!allowedGraders.has(c.user?.login?.toLowerCase())) continue;
              const grade = parseManualGrade(c.body || '');
              if (grade) { manual = { ...grade, grader: c.user.login }; break; }
            }

            const teacher = manual?.score ?? 0;
            const total = automatic + teacher;
            const rows = checks.map(([label,earned,max,detail]) => `| ${earned === max ? '✅' : earned ? '🟨' : '⬜'} ${label} | ${earned}/${max} | ${detail} |`).join('\n');
            const status = automatic < 60 ? '🟡 **IN PROGRESS — complete the missing automatic evidence.**' : !manual ? '🔵 **AUTOMATIC CHECKS PASSED — awaiting teacher review.**' : `✅ **FINAL SCORE: ${total}/100**`;
            const finalLine = manual ? `${total}/100` : 'pending teacher review';
            const prUrl = pr && parsed ? `https://github.com/${parsed.owner}/${parsed.repo}/pull/${pr.number}` : null;
            const submissionUrl = branchData && parsed ? `https://github.com/${parsed.owner}/${parsed.repo}/blob/${expectedBranch}/submission.md` : null;
            const template = ['```text','/manual-grade','Branch safety: 0/10','Git workflow explanation: 0/10','Pull Request understanding: 0/10','Reflection & work quality: 0/10','','Feedback:','Write concise feedback here.','```'].join('\n');

            const body = `${marker}
            ## CP2 Score — Mother Repository

            **Student:** @${student}  
            **Practice repository:** ${repositoryUrl || 'not provided'}  
            **Automatic score:** ${automatic}/60  
            **Teacher score:** ${manual ? `${teacher}/40 by @${manual.grader}` : 'awaiting review'}  
            **Final score:** ${finalLine}

            | Check | Score | Evidence |
            |---|---:|---|
            ${rows}
            | 🧑‍🏫 Teacher review | ${manual ? `${teacher}/40` : '—/40'} | ${manual ? `graded by @${manual.grader}` : 'awaiting review'} |

            ${status}

            ### Teacher review links
            ${prUrl ? `- [Open student Pull Request](${prUrl})` : '- Pull Request: not found'}
            ${submissionUrl ? `- [Open submission.md](${submissionUrl})` : '- submission.md: not available'}

            ### 🧑‍🏫 Teacher grading
            Grade here in the mother repository. The teacher score is published back to the student's CP2 progress display.

            ${template}

            **Re-grade:** after the student changes the repository, edit this submission Issue or add a comment.
            `;

            const old = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });

            if (manual && parsed?.owner) {
              const gradeBranch = 'grades';
              try { await github.rest.git.getRef({ owner, repo, ref: `heads/${gradeBranch}` }); }
              catch (e) {
                if (e.status !== 404) throw e;
                const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${gradeBranch}`, sha: mainRef.data.object.sha });
              }
              const gradePath = `.cp2-grades/${student.toLowerCase()}.json`;
              const gradeData = { version: 1, checkpoint: 'CP2', student: student.toLowerCase(), repository: repositoryUrl, automaticAtMother: automatic, teacherScore: teacher, finalAtMother: total, grader: manual.grader, breakdown: manual.breakdown, feedback: manual.feedback || '', submissionIssue: `https://github.com/${owner}/${repo}/issues/${issueNumber}`, updatedAt: new Date().toISOString() };
              let sha;
              try { const current = await github.rest.repos.getContent({ owner, repo, path: gradePath, ref: gradeBranch }); if (!Array.isArray(current.data)) sha = current.data.sha; }
              catch (e) { if (e.status !== 404) throw e; }
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: gradePath, branch: gradeBranch, message: `Publish CP2 teacher grade for ${student}`, content: Buffer.from(JSON.stringify(gradeData, null, 2) + '\n').toString('base64'), ...(sha ? { sha } : {}) });
            }

            await core.summary.addHeading(`CP2: ${total}/100`).addRaw(`Automatic: ${automatic}/60\n`).addRaw(`Teacher: ${manual ? `${teacher}/40` : 'awaiting review'}\n`).write();
