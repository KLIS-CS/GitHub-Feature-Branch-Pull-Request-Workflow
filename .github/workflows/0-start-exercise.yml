name: Start Exercise

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Create checkpoint issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp2-exercise -->';
            const username = context.actor;
            const branch = `cp2-${username}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (existing) {
              core.info(`Exercise issue already exists: #${existing.number}`);
              return;
            }

            const body = `${marker}
            ## Checkpoint 2 — Feature Branch & Pull Request Workflow

            Welcome @${username}.

            **Required branch:** \`${branch}\`

            Branch naming is strict: use exactly \`cp2-YOUR-GITHUB-USERNAME\`. For you, that means \`${branch}\`. The Pull Request must use this as the head/source branch and \`main\` as the base/target branch.

            ### Student checklist

            Keep this checklist. Check each item only after you have actually completed it.

            - [ ] I cloned this repository to my computer.
            - [ ] I created the exact required branch: \`${branch}\`.
            - [ ] I did **not** do the checkpoint work directly on \`main\`.
            - [ ] I changed \`feature.txt\` on \`${branch}\`.
            - [ ] I completed \`submission.md\` on \`${branch}\`.
            - [ ] In \`submission.md\`, my GitHub Username matches \`${username}\`.
            - [ ] In \`submission.md\`, Required Branch matches \`${branch}\`.
            - [ ] I used \`git status\` to inspect my repository state.
            - [ ] I staged my work with \`git add\`.
            - [ ] I committed my work with a meaningful commit message.
            - [ ] I pushed \`${branch}\` to GitHub.
            - [ ] I opened a Pull Request from \`${branch}\` → \`main\`.
            - [ ] I added the real Pull Request number to \`submission.md\`.
            - [ ] My Pull Request changes only \`feature.txt\` and \`submission.md\`.
            - [ ] I left the Pull Request open for grading.

            The automatic grader will also post an **Automatic requirement checklist** showing which graded requirements passed and which still need work.
            `;

            await github.rest.issues.create({
              owner,
              repo,
              title: 'Exercise: Checkpoint 2 — Feature Branch & Pull Request Workflow',
              body
            });
